name: Build Play Development Bundle

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/build-play-development.yml'
      - 'tool/prepare_play_development.py'
      - 'tool/tests/test_prepare_play_development.py'

permissions:
  contents: read

jobs:
  play-development:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - name: Install Android SDK components
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - run: flutter pub get
      - name: Validate tooling and prepare development configuration
        env:
          FIREBASE_OPTIONS_JSON: ${{ secrets.FIREBASE_OPTIONS_DEV_JSON }}
          PLAY_DEVELOPMENT_FIREBASE_JSON: ${{ secrets.PLAY_DEVELOPMENT_FIREBASE_JSON }}
          SENTRY_DSN_DEV: ${{ secrets.SENTRY_DSN_DEV }}
          POSTHOG_KEY_DEV: ${{ secrets.POSTHOG_KEY_DEV }}
        run: |
          python3 -m unittest discover -s tool/tests
          python3 tool/prepare_play_development.py
      - name: Run analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run full tests
        run: flutter test --dart-define=INTERNAL_TEST_BUILD=true
      - name: Restore dedicated development upload key
        env:
          KEY: ${{ secrets.PLAY_DEVELOPMENT_KEYSTORE_BASE64 }}
          PLAY_DEVELOPMENT_STORE_PASSWORD: ${{ secrets.PLAY_DEVELOPMENT_STORE_PASSWORD }}
          EXPECTED_CERT: ${{ vars.PLAY_DEVELOPMENT_UPLOAD_SHA256 }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, re, subprocess
          from pathlib import Path
          key = Path(os.environ['RUNNER_TEMP']) / 'play-development.p12'
          key.write_bytes(base64.b64decode(os.environ['KEY'], validate=True))
          key.chmod(0o600)
          result = subprocess.run(['keytool', '-exportcert', '-keystore', str(key), '-alias', 'play-development-upload', '-storepass:env', 'PLAY_DEVELOPMENT_STORE_PASSWORD'], check=True, capture_output=True)
          expected = os.environ['EXPECTED_CERT'].lower()
          assert re.fullmatch('[a-f0-9]{64}', expected), 'Missing approved upload certificate'
          assert hashlib.sha256(result.stdout).hexdigest() == expected, 'Upload certificate mismatch'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'PLAY_DEVELOPMENT_KEYSTORE={key}\n')
          PY
      - name: Build development release bundle
        env:
          PLAY_DEVELOPMENT_STORE_PASSWORD: ${{ secrets.PLAY_DEVELOPMENT_STORE_PASSWORD }}
        run: flutter build appbundle --release --build-number="$GITHUB_RUN_NUMBER" --dart-define-from-file=push-defines.json --dart-define="BUILD_SHA=$GITHUB_SHA" --dart-define="BUILD_RUN_ID=$GITHUB_RUN_ID"
      - name: Verify bundle identity and upload signing
        env:
          EXPECTED_CERT: ${{ vars.PLAY_DEVELOPMENT_UPLOAD_SHA256 }}
        run: |
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, zipfile
          from pathlib import Path
          import xml.etree.ElementTree as ET
          bundle = Path('build/app/outputs/bundle/release/app-release.aab')
          cert = subprocess.run(['keytool', '-printcert', '-jarfile', str(bundle), '-rfc'], check=True, capture_output=True, text=True).stdout
          import base64
          matches = re.findall(r'-----BEGIN CERTIFICATE-----\s*(.*?)\s*-----END CERTIFICATE-----', cert, re.S)
          assert len(matches) == 1, 'Expected one upload certificate'
          digest = hashlib.sha256(base64.b64decode(re.sub(r'\s', '', matches[0]))).hexdigest()
          assert digest == os.environ['EXPECTED_CERT'].lower(), 'Bundle upload certificate mismatch'
          manifests = list(Path('build/app/intermediates').glob('merged_manifests/release/**/AndroidManifest.xml'))
          assert manifests, 'Missing merged release manifest'
          for manifest in manifests:
              root = ET.parse(manifest).getroot()
              assert root.attrib['package'] == 'org.cozyhealth.app.dev'
              assert root.find('application').attrib.get('{http://schemas.android.com/apk/res/android}debuggable', 'false') == 'false'
          defines = json.loads(Path('push-defines.json').read_text())
          assert defines['COZY_ENVIRONMENT'] == 'development' and defines['INTERNAL_TEST_BUILD'] == 'true'
          assert json.loads(defines['FIREBASE_OPTIONS'])['android']['appId'] == '1:412988470560:android:09e562ad84991433e21345'
          with zipfile.ZipFile(bundle) as archive:
              assert archive.getinfo('base/manifest/AndroidManifest.xml').file_size > 0
          identity = dict(commit=os.environ['GITHUB_SHA'], run=os.environ['GITHUB_RUN_ID'], version_code=os.environ['GITHUB_RUN_NUMBER'], package='org.cozyhealth.app.dev', environment='development', upload_certificate_sha256=digest, sha256=hashlib.sha256(bundle.read_bytes()).hexdigest())
          Path('play-build-info.json').write_text(json.dumps(identity, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: play-development-aab-${{ github.sha }}-${{ github.run_id }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            play-build-info.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/play-development.p12"
