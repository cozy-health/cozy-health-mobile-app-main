name: Build iOS Unsigned IPA

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Record build identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          identity = {key: os.environ[key] for key in (
              'GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_NUMBER', 'GITHUB_REF_NAME')}
          Path('build-info.json').write_text(json.dumps(identity, indent=2) + '\n')
          PY
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Build number: $GITHUB_RUN_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build iOS (no codesign)
        run: |
          xcodebuild -version
          flutter build ipa --release --no-codesign --build-number="$GITHUB_RUN_NUMBER" --dart-define="BUILD_SHA=$GITHUB_SHA" --dart-define="BUILD_RUN_ID=$GITHUB_RUN_ID"

      - name: Verify Sentry native SDK version
        run: |
          ruby -ryaml -e '
            pods = YAML.load_file("ios/Podfile.lock").fetch("PODS")
            names = pods.flat_map { |pod| pod.is_a?(Hash) ? pod.keys : [pod] }
            expected = "Sentry/HybridSDK (8.46.0)"
            abort("Expected #{expected}; got #{names.grep(/Sentry/).inspect}") unless names.include?(expected)
            puts "Verified #{expected}"
          '

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Runner-unsigned.ipa

      - name: Verify IPA exists
        run: |
          ls -lh Runner-unsigned.ipa
          file Runner-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa-${{ github.sha }}-${{ github.run_id }}
          path: |
            Runner-unsigned.ipa
            build-info.json
          retention-days: 30
          if-no-files-found: error
